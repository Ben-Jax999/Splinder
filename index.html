<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swipe Playlist">
<meta name="theme-color" content="#0f1115">
<title>Swipe Playlist</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --card:#1c2029; --line:#2a2f3a;
    --text:#f3f4f6; --muted:#9aa1ae; --yes:#1ed760; --no:#ff4d5e; --accent:#1ed760;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  #app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 12px)}
  h1{font-size:24px;margin:6px 0 14px}
  h2{font-size:15px;margin:18px 0 4px}
  p{line-height:1.45}
  .hint{color:var(--muted);font-size:13px;margin:2px 0 8px}
  input[type=text],input[type=password],input[type=number],textarea,select{
    width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
  textarea{min-height:76px;resize:vertical}
  button{font-family:inherit;font-size:16px;cursor:pointer;border:none;color:var(--text)}
  .primary{width:100%;background:var(--accent);color:#06210f;font-weight:700;padding:14px;border-radius:12px;margin-top:18px}
  .primary:disabled{opacity:.5}
  .ghost{width:100%;background:transparent;border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:10px}
  .chip{background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:14px}
  .icon{background:transparent;font-size:28px;padding:0 8px;line-height:1}
  .row{display:flex;gap:10px;align-items:center}
  .copyrow{display:flex;gap:8px;align-items:center}
  .copyrow code{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;
    font-size:13px;word-break:break-all}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg label{flex:1;text-align:center;padding:10px 6px;border-radius:9px;font-size:14px;color:var(--muted)}
  .seg input{display:none}
  .seg input:checked + span{color:var(--text)}
  .seg label:has(input:checked){background:var(--card);color:var(--text);font-weight:600}
  .toggle{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:15px}
  .toggle input{width:20px;height:20px}
  .list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center}
  .item .grow{flex:1;min-width:0}
  .item .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .t2{color:var(--muted);font-size:13px;margin-top:2px}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .bar .title{flex:1;min-width:0}
  .bar .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .t2{color:var(--yes);font-size:13px}
  .status{color:var(--muted);font-size:13px;min-height:18px;margin:2px 2px 8px}
  .status a{color:var(--accent)}
  .read{font-style:italic;color:#c7ccd6;font-size:13px;margin:-4px 2px 8px}
  .stage{flex:1;display:flex;align-items:flex-start;justify-content:center;position:relative}
  .card{position:relative;width:100%;background:var(--card);border-radius:20px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none;
    transition:transform .2s ease}
  .art{width:100%;aspect-ratio:1/1;max-height:52dvh;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .art img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
  .info{padding:14px 16px 16px}
  .info .name{font-size:21px;font-weight:700;line-height:1.2}
  .info .artist{font-size:16px;color:#d4d8e0;margin-top:4px}
  .info .meta{font-size:13px;color:var(--muted);margin-top:4px}
  .info .why{font-size:14px;color:#c7ccd6;margin-top:10px}
  .info a{display:inline-block;margin-top:10px;color:var(--accent);font-size:13px;text-decoration:none}
  .stamp{position:absolute;top:22px;padding:6px 14px;border:4px solid;border-radius:10px;font-size:30px;
    font-weight:900;letter-spacing:2px;opacity:0;pointer-events:none}
  .stamp.yes{left:18px;color:var(--yes);border-color:var(--yes);transform:rotate(-14deg)}
  .stamp.no{right:18px;color:var(--no);border-color:var(--no);transform:rotate(14deg)}
  .controls{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 4px}
  .ctl{width:52px;height:52px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:20px;
    display:flex;align-items:center;justify-content:center}
  .ctl.big{width:70px;height:70px;font-size:30px}
  .ctl.no{color:var(--no);border-color:#5a2730}
  .ctl.yes{color:var(--yes);border-color:#1c5a33}
  .ctl:active{transform:scale(.92)}
  .ctl.sm{font-size:15px;font-weight:600}
  .center{text-align:center;color:var(--muted);padding:40px 10px}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:spin 1s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);
    background:#2b303b;color:var(--text);padding:12px 16px;border-radius:12px;font-size:14px;max-width:90%;
    box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  #toast.on{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet{background:var(--panel);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
  .big-num{font-size:56px;font-weight:800;color:var(--yes);text-align:center;margin:20px 0 0}
  a.btnlink{display:block;text-align:center;text-decoration:none}
  .danger{color:var(--no)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";

/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const API = "https://api.spotify.com/v1";
const SCOPES = [
  "playlist-read-private","playlist-read-collaborative",
  "playlist-modify-private","playlist-modify-public",
  "user-read-playback-state","user-modify-playback-state","user-read-private"
].join(" ");
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, "");

const LS = {
  get(k, d = null){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast("Couldn't save to this browser's storage."); } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

const DEFAULTS = { clientId: "", apiKey: "", model: "claude-sonnet-5-5", batchSize: 10, autoplay: true };
let cfg = Object.assign({}, DEFAULTS, LS.get("sp_cfg", {}));
let tok = LS.get("sp_tok", null);
let me = null;
let S = null;                 // current session
let seenU = new Set(), seenK = new Set();
let fetching = false, batchError = null;
let playing = { uri: null, on: false };
let screen = "";
let busy = false;
let chain = Promise.resolve(); // keeps playlist writes in order

let toastTimer;
function toast(msg, ms = 4200){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), ms);
}

/* ---------- Spotify login (PKCE) ---------- */
function randomString(len){
  const cs = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const a = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(a, x => cs[x % cs.length]).join("");
}
async function challengeFor(v){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function login(){
  const v = randomString(64), st = randomString(16);
  LS.set("sp_pkce", { v, st });
  const p = new URLSearchParams({
    response_type: "code", client_id: cfg.clientId, scope: SCOPES,
    code_challenge_method: "S256", code_challenge: await challengeFor(v),
    redirect_uri: REDIRECT_URI, state: st
  });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
async function handleCallback(){
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return;
  history.replaceState(null, "", REDIRECT_URI);
  if (q.get("error")) { toast("Spotify login didn't finish: " + q.get("error")); return; }
  const pk = LS.get("sp_pkce");
  if (!pk || pk.st !== q.get("state")) { toast("Login check failed. Try connecting again."); return; }
  const body = new URLSearchParams({
    grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT_URI,
    client_id: cfg.clientId, code_verifier: pk.v
  });
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body
  });
  const d = await r.json();
  if (!r.ok) { toast("Login failed: " + (d.error_description || d.error)); return; }
  saveTok(d); LS.del("sp_pkce");
}
function saveTok(d){
  tok = { access_token: d.access_token, refresh_token: d.refresh_token || tok?.refresh_token,
          expires_at: Date.now() + d.expires_in * 1000 };
  LS.set("sp_tok", tok);
}
async function refreshTok(){
  if (!tok?.refresh_token) throw new Error("Not connected to Spotify.");
  const body = new URLSearchParams({ grant_type: "refresh_token", refresh_token: tok.refresh_token, client_id: cfg.clientId });
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { tok = null; LS.del("sp_tok"); show("login"); throw new Error("Spotify login expired. Please reconnect."); }
  saveTok(d);
}
let refreshing = null;
async function ensureTok(){
  if (!tok) { show("login"); throw new Error("Not connected to Spotify."); }
  if (Date.now() > tok.expires_at - 60000) {
    refreshing = refreshing || refreshTok().finally(() => { refreshing = null; });
    await refreshing;
  }
}

/* ---------- Spotify API wrapper ---------- */
async function sp(method, path, body, opts = {}){
  await ensureTok();
  const qs = opts.query ? "?" + new URLSearchParams(opts.query) : "";
  const res = await fetch(API + path + qs, {
    method,
    headers: Object.assign({ Authorization: "Bearer " + tok.access_token }, body ? { "Content-Type": "application/json" } : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  const tries = opts._tries || 0;
  if (res.status === 401 && tries < 1) { await refreshTok(); return sp(method, path, body, { ...opts, _tries: tries + 1 }); }
  if (res.status === 429 && tries < 3) {
    const wait = (+res.headers.get("Retry-After") || 2) * 1000;
    await sleep(Math.min(wait, 10000)); return sp(method, path, body, { ...opts, _tries: tries + 1 });
  }
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch {}
  if (!res.ok) {
    const e = new Error(data?.error?.message || ("Spotify error " + res.status));
    e.status = res.status; e.reason = data?.error?.reason; throw e;
  }
  return data;
}

/* ---------- track helpers ---------- */
function compact(t){
  const imgs = t.album?.images || [];
  const img = (imgs.find(i => i.width && i.width <= 640 && i.width >= 300) || imgs[0] || {}).url || "";
  return {
    uri: t.uri, name: t.name, artists: (t.artists || []).map(a => a.name).join(", "),
    album: t.album?.name || "", year: (t.album?.release_date || "").slice(0, 4), img,
    url: t.external_urls?.spotify || ""
  };
}
function norm(s){
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/\(.*?\)|\[.*?\]/g, "").replace(/\s-\s.*$/, "").replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
}
const keyOf = t => norm(t.name) + "|" + norm(String(t.artists || "").split(",")[0]);
const label = t => `"${t.name}" by ${t.artists}`;
function markSeen(t){
  if (!seenU.has(t.uri)) { seenU.add(t.uri); S.seenU.push(t.uri); }
  const k = keyOf(t); if (!seenK.has(k)) { seenK.add(k); S.seenK.push(k); }
}
const isSeen = t => seenU.has(t.uri) || seenK.has(keyOf(t));

/* ---------- sessions ---------- */
function saveSession(){
  if (!S) return;
  LS.set("sp_s_" + S.id, S);
  const idx = LS.get("sp_index", []).filter(x => x.id !== S.id);
  idx.unshift({ id: S.id, name: S.name, created: S.created, yes: S.yes.length, url: S.playlistUrl });
  LS.set("sp_index", idx);
}
function loadSession(id){
  const s = LS.get("sp_s_" + id); if (!s) return false;
  S = s; seenU = new Set(S.seenU); seenK = new Set(S.seenK);
  batchError = null; playing = { uri: null, on: false };
  return true;
}

/* ---------- screens ---------- */
function show(name){ screen = name; ({ settings: renderSettings, login: renderLogin, home: renderHome,
  new: renderNew, swipe: renderSwipe, done: renderDone })[name](); }
function route(){
  if (!cfg.clientId || !cfg.apiKey) return show("settings");
  if (!tok) return show("login");
  show("home");
}

function renderSettings(){
  $("#app").innerHTML = `
    <div class="bar">${tok ? `<button class="icon" id="back">‹</button>` : ""}<h1 style="margin:6px 0">Settings</h1></div>
    <h2>Spotify Client ID</h2>
    <p class="hint">From your app at developer.spotify.com/dashboard.</p>
    <input type="text" id="cid" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(cfg.clientId)}">
    <h2>Redirect URI</h2>
    <p class="hint">Paste this exactly into your Spotify app's Redirect URIs.</p>
    <div class="copyrow"><code>${esc(REDIRECT_URI)}</code><button class="chip" id="copy">Copy</button></div>
    <h2>Anthropic API key</h2>
    <p class="hint">Saved only in this browser on this device. It never goes in the code.</p>
    <input type="password" id="key" autocomplete="off" value="${esc(cfg.apiKey)}">
    <h2>Picker model</h2>
    <input type="text" id="model" autocapitalize="off" spellcheck="false" value="${esc(cfg.model)}">
    <h2>Songs per batch</h2>
    <input type="number" id="bs" min="5" max="20" value="${esc(cfg.batchSize)}">
    <label class="toggle"><input type="checkbox" id="ap" ${cfg.autoplay ? "checked" : ""}> Auto-play each song as it comes up</label>
    <button class="primary" id="save">Save</button>
    ${tok ? `<button class="ghost danger" id="logout">Disconnect Spotify</button>` : ""}
  `;
  $("#back") && ($("#back").onclick = () => show("home"));
  $("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(REDIRECT_URI); toast("Copied"); } catch { toast("Couldn't copy. Press and hold the text to copy it."); }
  };
  $("#save").onclick = () => {
    const c = $("#cid").value.trim(), k = $("#key").value.trim();
    if (!c || !k) { toast("Both the Client ID and the API key are needed."); return; }
    const clientChanged = c !== cfg.clientId;
    cfg = { clientId: c, apiKey: k, model: $("#model").value.trim() || DEFAULTS.model,
            batchSize: Math.max(5, Math.min(20, parseInt($("#bs").value) || 10)), autoplay: $("#ap").checked };
    LS.set("sp_cfg", cfg);
    if (clientChanged) { tok = null; LS.del("sp_tok"); }
    toast("Saved"); route();
  };
  $("#logout") && ($("#logout").onclick = () => { tok = null; LS.del("sp_tok"); show("login"); });
}

function renderLogin(){
  $("#app").innerHTML = `
    <h1>Swipe Playlist</h1>
    <p>Connect your Spotify account so the app can read your playlists, make the new one, and play songs on your Spotify app.</p>
    <button class="primary" id="go">Connect Spotify</button>
    <button class="ghost" id="set">Settings</button>
  `;
  $("#go").onclick = login;
  $("#set").onclick = () => show("settings");
}

function renderHome(){
  const idx = LS.get("sp_index", []);
  $("#app").innerHTML = `
    <div class="bar"><h1 style="flex:1;margin:6px 0">Swipe Playlist</h1><button class="chip" id="set">Settings</button></div>
    <button class="primary" id="new">+ New playlist</button>
    <div class="list">
      ${idx.length ? idx.map(x => `
        <div class="item" data-id="${esc(x.id)}">
          <div class="grow"><div class="t1">${esc(x.name)}</div>
            <div class="t2">${x.yes} added · started ${new Date(x.created).toLocaleDateString()}</div></div>
          <button class="chip" data-act="resume">Resume</button>
          <button class="chip danger" data-act="del">✕</button>
        </div>`).join("") : `<p class="hint" style="text-align:center;margin-top:20px">No sessions yet.</p>`}
    </div>
  `;
  $("#set").onclick = () => show("settings");
  $("#new").onclick = () => show("new");
  document.querySelectorAll(".item").forEach(el => {
    const id = el.dataset.id;
    el.querySelector('[data-act="resume"]').onclick = () => {
      if (!loadSession(id)) { toast("Session not found."); return; }
      show("swipe"); maybePrefetch(); if (cfg.autoplay && S.queue[0]) playCurrent(true);
    };
    const del = el.querySelector('[data-act="del"]');
    del.onclick = () => {
      if (del.dataset.armed) {
        LS.del("sp_s_" + id); LS.set("sp_index", LS.get("sp_index", []).filter(x => x.id !== id));
        toast("Session removed. The Spotify playlist is untouched."); renderHome();
      } else { del.dataset.armed = "1"; del.textContent = "Remove?"; setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = "✕"; } }, 3000); }
    };
  });
}

async function loadMyPlaylists(){
  if (!me) me = await sp("GET", "/me");
  const out = []; let offset = 0;
  while (true) {
    const d = await sp("GET", "/me/playlists", null, { query: { limit: 50, offset } });
    for (const p of d?.items || []) {
      if (!p) continue;
      if (p.owner?.id === me.id || p.collaborative)
        out.push({ id: p.id, name: p.name, total: (p.items || p.tracks)?.total ?? "" });
    }
    if (!d?.next || offset > 2000) break;
    offset += 50;
  }
  return out;
}
async function loadPlaylistTracks(id){
  const out = [], uris = new Set(); let offset = 0;
  while (true) {
    const d = await sp("GET", `/playlists/${id}/items`, null, { query: { limit: 50, offset, market: "from_token" } });
    for (const e of d?.items || []) {
      const t = e?.item || e?.track;
      if (!t || t.type !== "track" || t.is_local || !String(t.uri).startsWith("spotify:track:")) continue;
      if (uris.has(t.uri)) continue;
      uris.add(t.uri); out.push(compact(t));
    }
    if (!d?.next || offset > 5000) break;
    offset += 50;
  }
  return out;
}

function renderNew(){
  $("#app").innerHTML = `
    <div class="bar"><button class="icon" id="back">‹</button><h1 style="margin:6px 0">New playlist</h1></div>
    <h2>Name</h2>
    <input type="text" id="name" maxlength="100" placeholder="Late Night Drive">
    <h2>Description</h2>
    <p class="hint">Goes on the Spotify playlist and tells the picker what you're going for.</p>
    <textarea id="desc" maxlength="300" placeholder="Moody 2000s and 2010s indie for driving around at night"></textarea>
    <h2>Extra guidance <span class="hint">(optional, private)</span></h2>
    <textarea id="guide" placeholder="No explicit songs. Lean toward tracks with big choruses."></textarea>
    <h2>How to start</h2>
    <div class="seg">
      <label><input type="radio" name="mode" value="seed" checked><span>From a playlist</span></label>
      <label><input type="radio" name="mode" value="batch"><span>Batches only</span></label>
    </div>
    <div id="seedBox">
      <h2>Start from</h2>
      <p class="hint">Only playlists you own or collaborate on can be read. To use someone else's, add its songs to a playlist of yours in Spotify first.</p>
      <select id="seed"><option value="">Loading your playlists…</option></select>
    </div>
    <label class="toggle"><input type="checkbox" id="pub"> Make the new playlist public</label>
    <button class="primary" id="start">Start swiping</button>
  `;
  $("#back").onclick = () => show("home");
  const seedBox = $("#seedBox");
  document.querySelectorAll('input[name="mode"]').forEach(r => r.onchange = () => {
    seedBox.style.display = $('input[name="mode"]:checked').value === "seed" ? "" : "none";
  });
  loadMyPlaylists().then(list => {
    $("#seed").innerHTML = list.length
      ? `<option value="">Choose a playlist</option>` + list.map(p => `<option value="${esc(p.id)}">${esc(p.name)}${p.total !== "" ? ` (${p.total})` : ""}</option>`).join("")
      : `<option value="">No playlists of yours found</option>`;
  }).catch(e => { $("#seed").innerHTML = `<option value="">Couldn't load playlists</option>`; toast(e.message); });
  $("#start").onclick = startSession;
}

async function startSession(){
  const name = $("#name").value.trim();
  const desc = $("#desc").value.trim().replace(/\s+/g, " ");
  const guide = $("#guide").value.trim();
  const mode = $('input[name="mode"]:checked').value;
  const seedSel = $("#seed");
  const seedId = seedSel.value;
  const seedName = seedId ? seedSel.options[seedSel.selectedIndex].text.replace(/\s\(\d+\)$/, "") : null;
  if (!name) { toast("Give the playlist a name."); return; }
  if (!desc && !guide) { toast("Add a description so the picker knows what you want."); return; }
  if (mode === "seed" && !seedId) { toast("Choose a playlist to start from, or pick Batches only."); return; }
  const btn = $("#start"); btn.disabled = true;
  try {
    let queue = [];
    if (mode === "seed") {
      btn.textContent = "Loading songs…";
      queue = await loadPlaylistTracks(seedId);
      if (!queue.length) toast("That playlist had no playable songs, so we'll go straight to batches.");
    }
    btn.textContent = "Creating playlist…";
    const pl = await sp("POST", "/me/playlists", { name, description: desc.slice(0, 300), public: $("#pub").checked });
    queue.forEach(t => t.src = "seed");
    S = {
      id: randomString(10), created: Date.now(), name, desc, guide,
      playlistId: pl.id, playlistUrl: pl.external_urls?.spotify || ("https://open.spotify.com/playlist/" + pl.id),
      seedName: queue.length ? seedName : null, seedTotal: queue.length, seedDone: 0,
      queue, yes: [], no: [], hist: [], seenU: [], seenK: [], batch: 0, read: ""
    };
    seenU = new Set(); seenK = new Set(); batchError = null; playing = { uri: null, on: false };
    queue.forEach(markSeen);
    saveSession();
    show("swipe");
    maybePrefetch();
    if (cfg.autoplay && S.queue[0]) playCurrent(true);
  } catch (e) {
    toast(e.status === 403 || e.status === 404
      ? "Spotify wouldn't share that playlist's songs. Make sure it's one you own."
      : e.message);
    btn.disabled = false; btn.textContent = "Start swiping";
  }
}

/* ---------- swipe screen ---------- */
function renderSwipe(){
  $("#app").innerHTML = `
    <div class="bar">
      <button class="icon" id="home">‹</button>
      <div class="title"><div class="t1">${esc(S.name)}</div><div class="t2" id="count"></div></div>
      <button class="chip" id="steer">Steer</button>
      <button class="chip" id="done">Done</button>
    </div>
    <div class="status" id="status"></div>
    <div class="read" id="read"></div>
    <div class="stage" id="stage"></div>
    <div class="controls">
      <button class="ctl" id="undo" title="Undo (Z)">↶</button>
      <button class="ctl big no" id="no" title="No (←)">✕</button>
      <button class="ctl" id="play" title="Play/Pause (Space)">▶</button>
      <button class="ctl big yes" id="yes" title="Yes (→)">♥</button>
      <button class="ctl sm" id="fwd" title="Skip ahead 30s (F)">+30</button>
    </div>
  `;
  $("#home").onclick = () => show("home");
  $("#done").onclick = () => show("done");
  $("#steer").onclick = openSteer;
  $("#undo").onclick = undo;
  $("#no").onclick = () => decide(false);
  $("#yes").onclick = () => decide(true);
  $("#play").onclick = togglePlay;
  $("#fwd").onclick = jump;
  updateSwipe();
}

function updateSwipe(){
  if (screen !== "swipe" || !S) return;
  $("#count").textContent = `♥ ${S.yes.length} added`;
  const t = S.queue[0];
  let status = "";
  if (t?.src === "seed") status = `From “${esc(S.seedName)}” · ${S.seedDone + 1} of ${S.seedTotal}`;
  else if (t?.src === "batch") status = `Batch ${t.batch} · song ${t.pos} of ${t.of}`;
  if (t && fetching) status += ` · picking next batch…`;
  if (t && batchError && !fetching) status += ` · next batch failed, <a href="#" id="retry2">retry</a>`;
  $("#status").innerHTML = status;
  $("#retry2") && ($("#retry2").onclick = e => { e.preventDefault(); fetchBatch(); });
  $("#read").textContent = (t?.src === "batch" && S.read) ? S.read : "";

  const stage = $("#stage");
  if (!t) {
    if (fetching) stage.innerHTML = `<div class="center"><div class="spinner"></div>Picking your next ${cfg.batchSize} songs…</div>`;
    else if (batchError) {
      stage.innerHTML = `<div class="center"><p>${esc(batchError)}</p><button class="primary" id="retry">Try again</button></div>`;
      $("#retry").onclick = fetchBatch;
    } else { stage.innerHTML = `<div class="center"><div class="spinner"></div>Getting songs…</div>`; maybePrefetch(); }
    updatePlayBtn(); return;
  }
  const meta = [t.album, t.year].filter(Boolean).map(esc).join(" · ");
  const why = t.src === "seed" ? "" : (t.why ? esc(t.why) : "");
  stage.innerHTML = `
    <div class="card" id="card">
      <div class="art">${t.img ? `<img src="${esc(t.img)}" alt="">` : `<span style="font-size:60px">♪</span>`}</div>
      <div class="stamp yes">ADD</div><div class="stamp no">NOPE</div>
      <div class="info">
        <div class="name">${esc(t.name)}</div>
        <div class="artist">${esc(t.artists)}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}
        ${why ? `<div class="why">${why}</div>` : ""}
        ${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">Open in Spotify ↗</a>` : ""}
      </div>
    </div>`;
  attachSwipe($("#card"));
  const next = S.queue[1]; if (next?.img) { const im = new Image(); im.src = next.img; }
  updatePlayBtn();
}

function attachSwipe(el){
  let sx = 0, dx = 0, drag = false;
  const yesS = el.querySelector(".stamp.yes"), noS = el.querySelector(".stamp.no");
  el.addEventListener("pointerdown", e => {
    if (e.target.closest("a")) return;
    drag = true; sx = e.clientX; dx = 0; el.setPointerCapture(e.pointerId); el.style.transition = "none";
  });
  el.addEventListener("pointermove", e => {
    if (!drag) return;
    dx = e.clientX - sx;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    yesS.style.opacity = Math.max(0, Math.min(1, dx / 100));
    noS.style.opacity = Math.max(0, Math.min(1, -dx / 100));
  });
  const end = () => {
    if (!drag) return; drag = false; el.style.transition = "";
    if (dx > 90) decide(true);
    else if (dx < -90) decide(false);
    else { el.style.transform = ""; yesS.style.opacity = 0; noS.style.opacity = 0; }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function queueWrite(fn){ chain = chain.then(fn).catch(e => toast(e.message)); return chain; }
function addToPlaylist(t, pid){
  queueWrite(async () => {
    try { await sp("POST", `/playlists/${pid}/items`, { uris: [t.uri] }); }
    catch (e) {
      if (e.status === 404) { await sp("POST", `/playlists/${pid}/tracks`, { uris: [t.uri] }); return; }
      throw new Error(`Couldn't add “${t.name}”: ${e.message}. Tap undo, then like it again.`);
    }
  });
}
function removeFromPlaylist(t, pid){
  queueWrite(async () => {
    try { await sp("DELETE", `/playlists/${pid}/items`, { items: [{ uri: t.uri }] }); }
    catch (e) {
      if (e.status === 400 || e.status === 404) { await sp("DELETE", `/playlists/${pid}/tracks`, { tracks: [{ uri: t.uri }] }); return; }
      throw new Error(`Couldn't remove “${t.name}” from the playlist: ${e.message}`);
    }
  });
}

async function decide(yes){
  if (busy || !S || !S.queue.length || screen !== "swipe") return;
  busy = true;
  const el = $("#card");
  if (el) {
    el.style.transition = "transform .22s ease-in, opacity .22s";
    el.style.transform = `translateX(${yes ? 130 : -130}vw) rotate(${yes ? 25 : -25}deg)`;
    el.style.opacity = "0";
    const st = el.querySelector(yes ? ".stamp.yes" : ".stamp.no"); if (st) st.style.opacity = 1;
  }
  const t = S.queue.shift();
  (yes ? S.yes : S.no).push(t);
  S.hist.push({ t, yes }); if (S.hist.length > 50) S.hist.shift();
  if (t.src === "seed") S.seedDone++;
  saveSession();
  if (yes) addToPlaylist(t, S.playlistId);
  await sleep(200);
  busy = false;
  updateSwipe();
  if (cfg.autoplay && S.queue[0]) playCurrent(true);
  maybePrefetch();
}

function undo(){
  if (busy || !S) return;
  const h = S.hist.pop();
  if (!h) { toast("Nothing to undo."); return; }
  const arr = h.yes ? S.yes : S.no;
  const i = arr.map(x => x.uri).lastIndexOf(h.t.uri);
  if (i >= 0) arr.splice(i, 1);
  if (h.t.src === "seed") S.seedDone = Math.max(0, S.seedDone - 1);
  S.queue.unshift(h.t);
  if (h.yes) removeFromPlaylist(h.t, S.playlistId);
  saveSession(); updateSwipe();
  toast(h.yes ? "Undone and removed from the playlist." : "Undone.");
  if (cfg.autoplay) playCurrent(true);
}

/* ---------- playback (controls your Spotify app) ---------- */
async function pickDevice(){
  const d = await sp("GET", "/me/player/devices");
  const list = (d?.devices || []).filter(x => !x.is_restricted);
  if (!list.length) return null;
  const mobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
  return list.find(x => x.is_active) || list.find(x => x.type === (mobile ? "Smartphone" : "Computer")) || list[0];
}
async function playUri(uri, deviceId){
  try {
    await sp("PUT", "/me/player/play", { uris: [uri] }, deviceId ? { query: { device_id: deviceId } } : {});
  } catch (e) {
    if (!deviceId && (e.status === 404 || /device/i.test(e.message))) {
      const d = await pickDevice();
      if (!d) throw new Error("No Spotify app found. Open Spotify, play any song for a second, then come back and tap ▶.");
      return playUri(uri, d.id);
    }
    throw e;
  }
}
async function playCurrent(auto = false){
  const t = S?.queue[0]; if (!t) return;
  try { await playUri(t.uri); playing = { uri: t.uri, on: true }; }
  catch (e) { toast(e.message, auto ? 5000 : 4200); }
  updatePlayBtn();
}
async function togglePlay(){
  const t = S?.queue[0]; if (!t) return;
  try {
    if (playing.uri === t.uri && playing.on) { await sp("PUT", "/me/player/pause"); playing.on = false; }
    else if (playing.uri === t.uri) { await sp("PUT", "/me/player/play"); playing.on = true; }
    else { await playUri(t.uri); playing = { uri: t.uri, on: true }; }
  } catch (e) { toast(e.message); }
  updatePlayBtn();
}
async function jump(){
  try {
    const p = await sp("GET", "/me/player");
    if (!p?.item) { toast("Nothing is playing right now."); return; }
    const pos = Math.min((p.progress_ms || 0) + 30000, Math.max(0, (p.item.duration_ms || 0) - 5000));
    await sp("PUT", "/me/player/seek", null, { query: { position_ms: pos } });
  } catch (e) { toast(e.message); }
}
function updatePlayBtn(){
  const b = $("#play"); if (!b) return;
  const t = S?.queue[0];
  b.textContent = (t && playing.uri === t.uri && playing.on) ? "❚❚" : "▶";
}

/* ---------- the picker (Claude) ---------- */
async function askClaude(prompt){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": cfg.apiKey, "anthropic-version": "2023-06-01", "content-type": "application/json",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: cfg.model, max_tokens: 3000,
      system: "You are a music curator helping someone build a Spotify playlist one yes/no swipe at a time. You suggest only real, released songs that are very likely available on Spotify. You reply with JSON only.",
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const m = data?.error?.message || ("Claude API error " + res.status);
    throw new Error(res.status === 401 ? "The Anthropic API key was rejected. Check it in Settings." : m);
  }
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
}
function parseJSON(text){
  let s = String(text).replace(/```(?:json)?/gi, "");
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if (a < 0 || b < a) throw new Error("The picker's answer couldn't be read. Try again.");
  return JSON.parse(s.slice(a, b + 1));
}
function buildPrompt(want){
  const yes = S.yes.slice(-150).map(label), no = S.no.slice(-150).map(label), q = S.queue.slice(0, 200).map(label);
  return [
    `PLAYLIST NAME: ${S.name}`,
    `DESCRIPTION: ${S.desc || "(none)"}`,
    S.guide ? `EXTRA GUIDANCE FROM THE LISTENER: ${S.guide}` : "",
    S.seedName ? `They began by reviewing the songs in their playlist "${S.seedName}".` : "",
    `\nSONGS THEY SAID YES TO (${S.yes.length} total${S.yes.length > 150 ? ", most recent 150 shown" : ""}):\n${yes.join("\n") || "(none yet)"}`,
    `\nSONGS THEY SAID NO TO (${S.no.length} total${S.no.length > 150 ? ", most recent 150 shown" : ""}):\n${no.join("\n") || "(none yet)"}`,
    q.length ? `\nALREADY QUEUED (do not repeat):\n${q.join("\n")}` : "",
    `\nTASK: Suggest ${want} songs for batch #${S.batch + 1}.`,
    `Rules:
- The name, description and guidance define the playlist. Use the yes/no history to learn their taste within that brief: artists, era, genre, energy, tempo, mood, vocal style, production.
- If they keep rejecting something (an artist, an era, a sound), stop suggesting it.
- About 70% should be confident picks close to their yeses; about 30% smart exploration that still fits the brief. With little or no feedback yet, give a varied spread across the brief so their answers teach you the most.
- Never suggest any song listed above.
- No more than 2 songs by the same artist in this batch.
- Use the exact song title and primary artist as Spotify lists them. Original studio versions only: no live, remix, cover, sped-up or karaoke versions unless the brief asks for them.
- Order the list best-first.
Reply with only this JSON, no markdown:
{"read": "one short sentence on what you've learned about their taste so far, or your opening plan if there's no feedback yet", "songs": [{"title": "...", "artist": "...", "why": "under 12 words on why it fits"}]}`
  ].filter(Boolean).join("\n");
}

function scoreMatch(t, c){
  const tn = norm(t.name), cn = norm(c.title);
  const an = norm(String(c.artist).split(/,|&| feat\.? | ft\.? | x | and /i)[0]);
  let s = 0;
  if (tn === cn) s += 3; else if (tn && cn && (tn.startsWith(cn) || cn.startsWith(tn))) s += 2; else return 0;
  const arts = (t.artists || []).map(a => norm(a.name));
  if (arts.some(a => a === an)) s += 3; else if (an && arts.some(a => a.includes(an) || an.includes(a))) s += 2; else return 0;
  const tl = t.name.toLowerCase(), cl = String(c.title).toLowerCase();
  if (/\b(live|karaoke|instrumental|cover|remix|sped up|slowed)\b/.test(tl) && !/\b(live|remix|instrumental)\b/.test(cl)) s -= 2;
  s += (t.popularity || 0) / 1000;
  return s;
}
async function resolveOne(c){
  const title = String(c.title).replace(/["“”]/g, "").trim(), artist = String(c.artist).replace(/["“”]/g, "").trim();
  for (const q of [`track:${title} artist:${artist}`, `${title} ${artist}`]) {
    let d; try { d = await sp("GET", "/search", null, { query: { q, type: "track", limit: 10, market: "from_token" } }); } catch { continue; }
    let best = null, bs = 0;
    for (const t of d?.tracks?.items || []) { const s = scoreMatch(t, c); if (s > bs) { bs = s; best = t; } }
    if (best && bs >= 4) return Object.assign(compact(best), { why: String(c.why || "") });
  }
  return null;
}
async function resolveAll(cands){
  const out = new Array(cands.length).fill(null); let i = 0;
  const worker = async () => { while (i < cands.length) { const k = i++; out[k] = await resolveOne(cands[k]); } };
  await Promise.all([worker(), worker(), worker()]);
  return out;
}

function maybePrefetch(){
  if (!S || fetching || batchError) return;
  if (S.queue.length <= 3) fetchBatch();
}
async function fetchBatch(){
  if (!S || fetching) return;
  fetching = true; batchError = null; updateSwipe();
  const sid = S.id, n = cfg.batchSize || 10;
  try {
    const json = parseJSON(await askClaude(buildPrompt(n + 6)));
    const cands = (json.songs || []).filter(s => s && s.title && s.artist);
    if (!cands.length) throw new Error("The picker didn't return any songs. Try again.");
    const resolved = await resolveAll(cands);
    if (!S || S.id !== sid) return;
    const found = [];
    for (const t of resolved) {
      if (!t || isSeen(t)) continue;
      markSeen(t); found.push(t);
      if (found.length >= n) break;
    }
    if (!found.length) throw new Error("None of the picked songs could be matched on Spotify. Try again.");
    S.batch++;
    found.forEach((t, i) => Object.assign(t, { src: "batch", batch: S.batch, pos: i + 1, of: found.length }));
    const wasEmpty = S.queue.length === 0;
    S.queue.push(...found);
    if (json.read) S.read = String(json.read);
    saveSession();
    fetching = false;
    updateSwipe();
    if (wasEmpty && cfg.autoplay && screen === "swipe") playCurrent(true);
  } catch (e) {
    if (S && S.id === sid) batchError = e.message || "Something went wrong picking songs.";
  } finally {
    fetching = false;
    if (S && S.id !== sid) maybePrefetch(); else updateSwipe();
  }
}

/* ---------- steer ---------- */
function openSteer(){
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `
    <div class="sheet">
      <h2 style="margin-top:0">Steer the picker</h2>
      <p class="hint">Change the guidance mid-session, like “more upbeat” or “no more country.”</p>
      <textarea id="g2">${esc(S.guide || "")}</textarea>
      <button class="primary" id="g2re">Save and re-pick upcoming songs</button>
      <button class="ghost" id="g2save">Save for the next batch</button>
      <button class="ghost" id="g2x">Cancel</button>
    </div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  $("#g2x").onclick = close;
  $("#g2save").onclick = () => { S.guide = $("#g2").value.trim(); saveSession(); close(); toast("Saved for the next batch."); };
  $("#g2re").onclick = () => {
    if (fetching) { toast("A batch is being picked right now. Try again in a moment."); return; }
    S.guide = $("#g2").value.trim();
    S.queue = S.queue.filter((t, i) => i === 0 || t.src === "seed");
    saveSession(); close(); batchError = null;
    if (S.queue.length <= 3) fetchBatch(); else toast("Saved. It'll apply once the seed playlist is done.");
    updateSwipe();
  };
}

/* ---------- done ---------- */
function renderDone(){
  $("#app").innerHTML = `
    <div class="bar"><button class="icon" id="back">‹</button><h1 style="margin:6px 0">${esc(S.name)}</h1></div>
    <div class="big-num">${S.yes.length}</div>
    <p style="text-align:center;color:var(--muted);margin-top:0">songs added to your playlist</p>
    <a class="primary btnlink" href="${esc(S.playlistUrl)}" target="_blank" rel="noopener">Open in Spotify</a>
    <button class="ghost" id="pause">Pause playback</button>
    <button class="ghost" id="more">Keep swiping</button>
    <button class="ghost" id="home">Home</button>
  `;
  $("#back").onclick = () => show("swipe");
  $("#more").onclick = () => { show("swipe"); maybePrefetch(); };
  $("#home").onclick = () => show("home");
  $("#pause").onclick = async () => { try { await sp("PUT", "/me/player/pause"); playing.on = false; toast("Paused."); } catch (e) { toast(e.message); } };
}

/* ---------- keyboard (computer) ---------- */
document.addEventListener("keydown", e => {
  if (screen !== "swipe" || e.target.closest("input,textarea,select") || document.querySelector(".modal")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); decide(true); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); decide(false); }
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "z" || e.key === "Backspace") { e.preventDefault(); undo(); }
  else if (e.key === "f") { e.preventDefault(); jump(); }
});

/* ---------- start ---------- */
(async function boot(){
  try { await handleCallback(); } catch (e) { toast(e.message); }
  route();
})();
</script>
